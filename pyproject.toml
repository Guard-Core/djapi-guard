[project]
name = "djapi-guard"
version = "5.0.0"
description = "A security library for Django to control IPs, log requests, and detect penetration attempts."
authors = [
    {name = "Renzo Franceschini", email = "rennf93@guard-core.com"}
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.16"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: Django",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
]
dependencies = [
    "django>=5.2.17",
    "guard-core>=4.4.0",
]

[project.urls]
Homepage = "https://github.com/Guard-Core/djapi-guard"
Documentation = "https://guard-core.github.io/djapi-guard/latest/"
Repository = "https://github.com/Guard-Core/djapi-guard"
Issues = "https://github.com/Guard-Core/djapi-guard/issues"
Changelog = "https://github.com/Guard-Core/djapi-guard/blob/master/CHANGELOG.md"

[project.optional-dependencies]
redis = [
    "guard-core[redis]",
]
geo = [
    "guard-core[geo]",
]
cloud = [
    "guard-core[cloud]",
]
dev = [
    "bandit[toml]",
    "deptry",
    "django-stubs",
    "guard-agent",
    "guard-core[cloud,geo,redis]",
    "httpx",
    "mypy",
    "pip-audit; python_version >= '3.11'",
    "pre-commit; python_version >= '3.11'",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-mock",
    "radon",
    "ruff",
    "safety; python_version >= '3.11'",
    "types-cachetools",
    "types-requests",
    "vulture",
    "xenon",
]

[dependency-groups]
release = [
    "build",
]
docs = [
    "mike",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings",
    "mkdocstrings-python",
    "pymarkdownlnt",
    "yq",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["djangoapi_guard"]

[tool.hatch.build.targets.sdist]
exclude = [
    ".env",
    ".envrc",
    ".venv/",
    ".github/",
    ".claude/",
    "CLAUDE.md",
    ".pre-commit-config.yaml",
    "compose.yml",
    "Dockerfile",
    "Makefile",
    "mkdocs.yml",
    "vulture_whitelist.py",
    "tests/",
    "docs/",
    "examples/",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
target-version = "py310"
exclude = ["vulture_whitelist.py", ".venv"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "UP",
    "B",
    "I",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"examples/**/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "--cov=djangoapi_guard --cov-branch --cov-report=term-missing --ignore=tests/test_agent"
DJANGO_SETTINGS_MODULE = "tests.settings"

[tool.mypy]
python_version = "3.10"
explicit_package_bases = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/examples/advanced:$MYPY_CONFIG_FILE_DIR/examples/simple"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
exclude = ["vulture_whitelist.py", ".venv", "setup.py", "examples/simple/manage.py"]
plugins = ["mypy_django_plugin.main"]

# D-189 Any ratchet: begin (shrink the list, never grow it; tests/test_any_ratchet.py holds the line)
[[tool.mypy.overrides]]
module = "djangoapi_guard.*"
disallow_any_explicit = true

# D-189 Any ratchet: end

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pymarkdown.extensions]
# Enable YAML front matter parsing (agent skill files use front matter)
front-matter = {enabled = true}

[tool.pymarkdown.plugins.md007]
enabled = true
indent = 2

[tool.pymarkdown.plugins.md012]
enabled = true
maximum = 2

[tool.pymarkdown.plugins.md013]
enabled = false

[tool.pymarkdown.plugins.md024]
enabled = true
siblings_only = true

[tool.pymarkdown.plugins.md033]
enabled = false

[tool.pymarkdown.plugins.md035]
enabled = false

[tool.pymarkdown.plugins.md041]
enabled = false

[tool.pymarkdown.plugins.md046]
enabled = false

[tool.pymarkdown.plugins.md029]
enabled = false

[tool.vulture]
paths = ["djangoapi_guard", "tests", "vulture_whitelist.py"]
exclude = ["**/conftest.py", ".venv"]
min_confidence = 100
ignore_decorators = [
    "@pytest.fixture",
    "@pytest.mark.*",
    "@validator",
    "@root_validator",
    "@field_validator",
    "@model_validator",
]
ignore_names = [
    "test_*",
    "Test*",
    "cleanup_*",
    "mock_*",
    "expected_*",
    "exc_*",
    "__*__",
    "Config",
    "Field",
]
sort_by_size = true

[tool.bandit]
skips = ["B101", "B601"]
exclude_dirs = ["tests", ".venv", "vulture_whitelist.py"]
severity = "medium"

[tool.radon]
exclude = "tests/*,.venv/*,vulture_whitelist.py"
cc_min = "C"
mi_min = "A"
no_assert = false
show_closures = true
total_average = true

[tool.xenon]
max_absolute = "B"
max_modules = "A"
max_average = "A"
exclude = ["tests/*", ".venv/*", "vulture_whitelist.py"]
ignore = []

[tool.uv]
exclude-newer = "7 days"
override-dependencies = ["filelock>=4.2.1"]

[tool.uv.exclude-newer-package]
guard-agent = "0 days"
guard-core = "0 days"
virtualenv = "2026-10-23T00:00:00Z"

[tool.deptry]
exclude = ["tests", ".venv", "vulture_whitelist.py", "examples", "docs"]
extend_exclude = ["conftest.py"]
known_first_party = ["djangoapi_guard", "guard_core"]
per_rule_ignores = { "DEP002" = [
    "bandit",
    "django-stubs",
    "guard-agent",
    "guard-core",
    "httpx",
    "deptry",
    "mkdocs",
    "mkdocstrings",
    "mkdocstrings-python",
    "mike",
    "mkdocs-material",
    "build",
    "mypy",
    "pip-audit",
    "pre-commit",
    "pymarkdownlnt",
    "yq",
    "pytest",
    "pytest-cov",
    "pytest-django",
    "pytest-mock",
    "radon",
    "ruff",
    "safety",
    "types-cachetools",
    "types-requests",
    "vulture",
    "xenon",
] }
